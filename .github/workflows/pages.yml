name: Education website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: education-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing geometry, clock, controls and language
        run: node --test docs/etap-7/animation.test.mjs docs/etap-10/vortex.test.mjs docs/etap-11/particles.test.mjs education/show.test.mjs
      - name: Check GeoGebra packages and public viewer
        run: |
          node --check education/geogebra/g2/viewer.mjs
          python3 education/geogebra/verify-artifacts.py
          python3 education/geogebra/g2/verify-artifacts.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy educational show
        id: deployment
        uses: actions/deploy-pages@v4
