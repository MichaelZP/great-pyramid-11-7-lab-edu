<!doctype html><html lang="pl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontrola filmu: stała piramida i lustrzane spirale</title>
<style>body{margin:0;background:#0e202b;color:#e5eef0;font:16px system-ui}video{display:block;width:100%;max-height:88vh}p{margin:12px}button{padding:12px}</style>
<video id="video" controls preload="auto" src="../demo-spirals.webm"></video>
<button id="final">Pokaż finał · 25 s</button><p id="metadata" role="status">Wczytywanie nagrania…</p>
<script>
const video=document.getElementById('video'),metadata=document.getElementById('metadata');
document.getElementById('final').onclick=()=>{video.pause();video.currentTime=25;};
function report(){metadata.textContent=JSON.stringify({width:video.videoWidth,height:video.videoHeight,duration:video.duration,time:video.currentTime,readyState:video.readyState,error:video.error?.message??null});}
for(const event of ['loadedmetadata','loadeddata','seeked','timeupdate','error','ended'])video.addEventListener(event,report);
</script></html>
